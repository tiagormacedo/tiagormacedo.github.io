<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <title>Guess The Number</title>
    </head>

    <body>
        <main id="container">
            <h1>Guess the Number</h1>

            <section id="intro">
                <p>I am thinking of an integer number between 1 and 1000.</p>
                <p>Can you guess which number I am thinking of?</p>
                <p>You have <b>10</b> chances to get it right.</p>
            </section>

            <form id="guess-form" novalidate>
                <label for="user-guess">Guess a number between 1 and 1000:</label>
                <input type="number" id="user-guess" name="user-guess" min="1" max="1000" required>
                <button type="submit" id="try-button">Try</button>
                <div class="error-message" aria-live="polite">&nbsp;</div>
            </form>

            <section class="display">
                <div id="attempts">
                    <p>Remaining chances: <span id="chances-left">10</span></p>
                </div>

                <div id="goal-number" aria-hidden="true">
                    &nbsp;?&nbsp;
                </div>

                <div id="guessed-number">
                    <div id="info" role="status"></div>

                    <button type="button" id="play-again" hidden>
                        Play again
                    </button>
                </div>

            </section>

        </main>
    </body>
</html>
